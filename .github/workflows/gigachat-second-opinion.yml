name: GigaChat second opinion

on:
  workflow_dispatch:
    inputs:
      lyrics_path:
        description: "Путь к файлу с текстом в репо. Smoke-тест: integrations/gigachat/samples/smoke-test.md"
        required: true
        type: string
        default: "integrations/gigachat/samples/smoke-test.md"
      model:
        description: "Модель (пусто = GigaChat-3.5-Ultra)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  opinion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r integrations/gigachat/requirements.txt

      - name: Install Russian Trusted CA (Минцифры)
        run: |
          sudo cp integrations/gigachat/certs/russian-trusted-root-ca.pem /usr/local/share/ca-certificates/russian-trusted-root-ca.crt
          sudo cp integrations/gigachat/certs/russian-trusted-sub-ca.pem /usr/local/share/ca-certificates/russian-trusted-sub-ca.crt
          sudo update-ca-certificates

      - name: Run second opinion
        env:
          GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
          GIGACHAT_MODEL: ${{ inputs.model }}
          REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
        run: python integrations/gigachat/second_opinion.py "${{ inputs.lyrics_path }}"

      - name: Commit opinion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SRC="${{ inputs.lyrics_path }}"
          OUT="${SRC%.*}.gigachat-opinion.md"
          git add "$OUT"
          git commit -m "gigachat second opinion: $OUT" || echo "nothing to commit"
          git push
