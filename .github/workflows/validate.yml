name: Validate KB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Encoding guard - no U+FFFD or non-UTF-8 bytes in tracked text
        run: python3 scripts/check_encoding.py .

      - name: Run KB validation
        run: python3 validate.py

      - name: Detector 2.0 mechanical lint - self-test (blocking regression gate)
        run: python3 scripts/lint_patterns.py --self-test

      - name: Detector 2.0 mechanical lint - real lyrics (blocking, issue #14)
        run: |
          if [ -d lyrics ]; then
            find lyrics -name '*.md' -print0 | xargs -0 python3 scripts/lint_patterns.py
          fi

      - name: Detector 2.0 mechanical lint - existing cases (advisory, non-blocking)
        run: |
          # Known toothless while cards hold no lyric text (issue #14); kept
          # so card-level linting activates automatically if cards ever gain
          # marked '## Текст' blocks (extract_lint_text handles them too).
          find cases -name '*.md' -print0 | xargs -0 python3 scripts/lint_patterns.py || true
