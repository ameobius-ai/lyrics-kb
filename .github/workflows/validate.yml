name: Validate KB

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Encoding guard - no U+FFFD or non-UTF-8 bytes in tracked text
        run: python3 scripts/check_encoding.py .

      - name: GigaChat input path policy - self-test
        run: python3 -m unittest integrations/gigachat/test_path_policy.py

      - name: Run KB validation
        run: python3 validate.py

      - name: Detector 2.0 mechanical lint - self-test (blocking regression gate)
        run: python3 scripts/lint_patterns.py --self-test

      - name: Detector 2.0 mechanical lint - real lyrics (blocking, issue #14)
        run: |
          # README.md excluded: it documents the format (incl. slop examples)
          # and must not be swept itself. -r: never run the lint on zero
          # files (an empty xargs would fall through to --self-test).
          if [ -d lyrics ]; then
            find lyrics -name '*.md' ! -name 'README.md' -print0 | xargs -0 -r python3 scripts/lint_patterns.py
          fi

      - name: Detector 2.0 mechanical lint - existing cases (advisory, non-blocking)
        run: |
          # Known toothless while cards hold no lyric text (issue #14); kept
          # so card-level linting activates automatically if cards ever gain
          # marked '## Текст' blocks (extract_lint_text handles them too).
          find cases -name '*.md' -print0 | xargs -0 python3 scripts/lint_patterns.py || true

      - name: Install locked optional POS layer (advisory only - issue #81)
        continue-on-error: true
        run: |
          pip install --requirement requirements-pos.txt
          pip check

      - name: POS advisory measurement - noun_stack/adj_pile on lyrics/ (non-blocking, issue #31)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip show pymorphy3 pymorphy3-dicts-ru dawg2-python >/dev/null 2>&1 || { echo "locked POS layer unavailable, measurement skipped"; exit 0; }
          STACK=$(python3 -c 'from importlib.metadata import version; print("pymorphy3 {}; dicts-ru {}; dawg2-python {}".format(version("pymorphy3"), version("pymorphy3-dicts-ru"), version("dawg2-python")))')
          # Full lint output, no grep: only files with flags/advisories/exempts
          # print anything, so the POS hits stay attributed to their files.
          OUT=$(find lyrics -name '*.md' ! -name 'README.md' -print0 | xargs -0 -r python3 scripts/lint_patterns.py --pos-trace 2>&1 || true)
          BODY=$(printf '### POS advisory (%s; issue #31)\n\nLint output on lyrics/ (advisory/exempt lines, attributed):\n\n```\n%s\n```\n\nAdvisory only (weight 0.0) — never blocks the build. Weights come only after a G-pair and a zero-FP live measurement per the §0 protocol.' "$STACK" "${OUT:-<no hits>}")
          echo "$BODY" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY" || true
          fi
